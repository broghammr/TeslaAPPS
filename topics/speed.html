<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f5" id="theme-color-meta" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Speed – Aktuelle Geschwindigkeit und Fahrtrichtung im Tesla Browser"
    />
    <title>Speed – Geschwindigkeit</title>
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="../assets/apple-touch-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="../assets/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="../assets/apple-touch-icon-120x120.png" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      .speed-page {
        overflow: hidden;
      }

      .speed-weather-backdrop {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--text-muted);
        opacity: 0.11;
        pointer-events: none;
      }

      .speed-weather-backdrop svg {
        width: min(78vw, 1000px);
        height: min(78vh, 720px);
        overflow: visible;
      }

      .speed-weather-backdrop path,
      .speed-weather-backdrop circle,
      .speed-weather-backdrop line {
        fill: none;
        stroke: currentColor;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .speed-weather-backdrop circle.weather-sun {
        fill: currentColor;
        stroke: none;
      }

      .weather-tile__backdrop {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.1;
        pointer-events: none;
      }

      .weather-tile__backdrop path,
      .weather-tile__backdrop circle,
      .weather-tile__backdrop line {
        fill: none;
        stroke: var(--text-muted);
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .weather-tile__backdrop circle.weather-sun {
        fill: var(--text-muted);
        stroke: none;
      }

      .speed-app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        min-height: 100vh;
        position: relative;
        z-index: 1;
      }

      .speed-page-title {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .speed-hub {
        width: 100%;
      }

      .speed-map {
        min-height: 340px;
        padding: 1rem;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .speed-map__svg {
        width: min(100%, 216px);
        height: auto;
        overflow: visible;
      }

      .speed-map__marker-halo {
        fill: var(--bg-tile);
        stroke: #0070f3;
        stroke-width: 4;
      }

      .speed-map__marker {
        fill: #0070f3;
      }

      @media (min-width: 1200px) {
        .speed-hub .tile-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      .tile--speed {
        min-height: 220px;
        padding: 0;
        overflow: hidden;
        cursor: default;
        background: var(--bg-tile);
        border: 2px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        position: relative;
      }

      .tile--speed:hover,
      .tile--speed:focus-visible,
      .tile--speed:active {
        background: var(--bg-tile);
        border-color: var(--accent);
        box-shadow: var(--shadow-hover);
        transform: none;
      }

      .tile--heading {
        min-height: 220px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        cursor: default;
        background: var(--bg-tile);
        border: 2px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        position: relative;
      }

      .tile--heading:hover,
      .tile--heading:focus-visible,
      .tile--heading:active {
        background: var(--bg-tile);
        border-color: var(--accent);
        box-shadow: var(--shadow-hover);
        transform: none;
      }

      .tile--weather {
        min-height: 220px;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        cursor: default;
        text-align: center;
        position: relative;
      }

      .tile--weather > :not(.weather-tile__backdrop) {
        position: relative;
        z-index: 1;
      }

      .weather-tile__title {
        margin: 0;
        color: var(--text-muted);
        font-size: 1rem;
        font-weight: 700;
      }

      .weather-tile__temperature {
        width: 100%;
        font-size: clamp(2.5rem, 8vw, 4rem);
        font-weight: 800;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        text-align: center;
      }

      .weather-tile__condition {
        font-size: 1.2rem;
        font-weight: 700;
      }

      .weather-tile__location {
        color: var(--text-muted);
        font-size: 0.8rem;
        font-variant-numeric: tabular-nums;
      }

      .speed-compass {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        pointer-events: none;
        user-select: none;
      }

      .speed-compass__arrow {
        width: 4.5rem;
        height: 4.5rem;
        color: var(--accent);
        transition: transform 0.3s ease;
      }

      .speed-compass__label {
        font-size: 2.4rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: var(--text);
        line-height: 1;
      }

      .speed-compass__altitude {
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--text-muted);
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .speed-value {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0;
        font-size: clamp(3.5rem, 16vw, 9rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        text-align: center;
        padding: 0 1rem;
      }

      .speed-value__unit {
        margin-top: 0.5rem;
        font-size: 0.45em;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body class="speed-page">
    <div class="speed-weather-backdrop" aria-hidden="true">
      <svg id="weather-backdrop" viewBox="0 0 400 300"></svg>
    </div>
    <div class="app speed-app">
      <h1 class="page-title speed-page-title">
        <a
          class="page-title--link"
          href="../index.html"
          title="Zum Main Hub"
          aria-label="Zurück zum Main Hub: Elon's World"
          >Elon's World ;-)</a
        >
        <span class="page-title__topic">Speed</span>
      </h1>
      <main class="hub speed-hub">
        <div class="tile-grid" role="list">
          <div class="tile tile--speed" role="listitem">
            <p class="speed-value" id="speed-value">
              <span id="speed-number">–</span><span class="speed-value__unit">km/h</span>
            </p>
          </div>
          <div class="tile tile--heading" role="listitem">
            <div class="speed-compass" aria-hidden="true">
              <svg class="speed-compass__arrow" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2 L19 21 L12 17 L5 21 Z"></path>
              </svg>
              <span class="speed-compass__label" id="heading-label">–</span>
              <span class="speed-compass__altitude" id="altitude-label">–</span>
            </div>
          </div>
          <section class="tile tile--weather" role="listitem" aria-label="Aktuelles Wetter">
            <svg class="weather-tile__backdrop" id="weather-tile-backdrop" viewBox="0 0 400 300" aria-hidden="true"></svg>
            <h2 class="weather-tile__title">Wetter am Standort</h2>
            <span class="weather-tile__temperature" id="weather-temperature" aria-live="polite">–</span>
            <span class="weather-tile__condition" id="weather-condition">Standort wird ermittelt…</span>
            <span class="weather-tile__location" id="weather-location"></span>
          </section>
          <section class="tile speed-map" role="listitem" aria-label="Aktuelle GPS-Position auf der Deutschlandkarte">
            <svg class="speed-map__svg" viewBox="0 0 591.504 800.504" role="img" aria-labelledby="speed-map-title">
              <title id="speed-map-title">Deutschlandkarte mit aktueller GPS-Position</title>
              <image href="../assets/germany.svg" x="0" y="0" width="591.504" height="800.504" />
              <circle class="speed-map__marker-halo" id="speed-map-marker-halo" cx="0" cy="0" r="13" visibility="hidden" />
              <circle class="speed-map__marker" id="speed-map-marker" cx="0" cy="0" r="7" visibility="hidden" />
            </svg>
          </section>
        </div>
      </main>
    </div>

    <script src="speed.js"></script>
  </body>
</html>
