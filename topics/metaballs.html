<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Animierte Metaballs" />
    <title>Metaballs</title>
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="metaballs-page">
    <div class="app metaballs-app">
      <h1 class="metaballs-page-title">Metaballs</h1>
      <main class="hub metaballs-hub">
        <div class="tile-grid metaballs-grid" role="list">
          <section
            class="tile tile--metaballs"
            role="listitem"
            aria-labelledby="metaballs-title"
          >
            <h2 id="metaballs-title" class="visually-hidden">
              Animierte Metaballs
            </h2>
            <div class="metaballs-glow" aria-hidden="true"></div>
            <canvas
              id="metaballs-canvas"
              class="metaballs-canvas"
              aria-label="Animierte blaue Metaballs"
            ></canvas>
          </section>
        </div>
      </main>
    </div>
    <script src="metaballs.js"></script>
  </body>
</html>
