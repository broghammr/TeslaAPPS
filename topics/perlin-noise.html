<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Animierter Perlin Noise" />
    <title>Perlin Noise</title>
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="perlin-page">
    <div class="app perlin-app">
      <h1 class="perlin-page-title">Perlin Noise</h1>
      <main class="hub perlin-hub">
        <div class="tile-grid perlin-grid" role="list">
          <section
            class="tile tile--perlin"
            role="listitem"
            aria-labelledby="perlin-title"
          >
            <h2 id="perlin-title" class="visually-hidden">Animierter Perlin Noise</h2>
            <figure class="tile__preview" id="perlin-chart"></figure>
          </section>
        </div>
      </main>
    </div>
    <script src="../perlin-noise.js"></script>
    <script src="perlin-noise.js"></script>
  </body>
</html>
