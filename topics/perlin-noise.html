<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f5" id="theme-color-meta" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Testansicht der Perlin-Noise-Funktion" />
    <title>Perlin Noise – Tesla Apps</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="app">
      <h1 class="page-title">
        <a class="page-title--link" href="../index.html">← Main Hub</a>
        <span class="page-title__topic">Perlin Noise – Test</span>
      </h1>
      <main class="hub">
        <section class="tile tile--perlin" aria-labelledby="perlin-title">
          <span class="tile__icon" aria-hidden="true">
            <img
              class="tile__pictogram"
              src="../assets/code.svg"
              alt=""
              width="36"
              height="36"
            />
          </span>
          <div class="tile__body">
            <h2 class="tile__title" id="perlin-title">Perlin Noise</h2>
          </div>
          <figure class="tile__preview" id="perlin-chart"></figure>
        </section>
      </main>
    </div>
    <script src="../perlin-noise.js"></script>
    <script src="perlin-noise.js"></script>
  </body>
</html>
