<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f5" />
    <meta
      name="description"
      content="Tesla Apps Hub – Themen und Apps für den Browser im Auto"
    />
    <title>Tesla Apps – Hub</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="header__brand">
          <span class="header__mark" aria-hidden="true"></span>
          <div>
            <p class="header__eyebrow">Tesla Browser</p>
            <h1 class="header__title">Apps Hub</h1>
          </div>
        </div>
        <p class="header__hint">Thema wählen · große Kacheln · gut lesbar</p>
      </header>

      <main class="hub" id="hub">
        <section class="hub__section" aria-labelledby="topics-heading">
          <h2 id="topics-heading" class="hub__section-title">Themen</h2>
          <div class="tile-grid" id="tile-grid" role="list"></div>
        </section>
      </main>

      <footer class="footer">
        <p>Für den Tesla-Browser optimiert · Grautöne + Blau</p>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
