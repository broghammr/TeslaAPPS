<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f5" id="theme-color-meta" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Tesla Apps Hub – Themen und Apps für den Browser im Auto"
    />
    <title>Tesla Apps – Hub</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="assets/apple-touch-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="assets/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="assets/apple-touch-icon-120x120.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Sichtbar nur bei prefers-color-scheme: dark (Tesla-Nachtmodus) -->
    <div
      class="night-indicator"
      id="night-indicator"
      role="status"
      aria-live="polite"
      aria-label="Nachtmodus aktiv"
      hidden
    >
      <img
        class="night-indicator__moon"
        src="assets/moon.svg"
        alt=""
        width="28"
        height="28"
        decoding="async"
      />
    </div>

    <div class="app">
      <h1 class="page-title">Elon's World ;-)</h1>
      <main class="hub" id="hub">
        <div class="tile-grid" id="tile-grid" role="list"></div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
